# nginx config for the production web image (see Dockerfile.prod).
#
# Serves the built PWA and proxies /api to the backend on the SAME ORIGIN.
# That's deliberate rather than incidental: the backend deliberately has no
# CORSMiddleware (app/main.py), and the web client stores its tokens in
# localStorage, so keeping app and API same-origin avoids both a CORS
# configuration surface and a cross-origin token story.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads flow through here to the backend, whose own cap is 32MB
    # (MAX_ATTACHMENT_BYTES in api/v1/attachments.py). Keep this at least
    # that large or nginx rejects the request first, with a less useful
    # error than the API's own.
    client_max_body_size 40M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers for the APP origin. Deliberately NOT the API's
    # policy -- that one is `default-src 'none'` because the API serves only
    # JSON and attachment blobs. This is a real web app: it must load its
    # own scripts, styles and service worker.
    #
    # 'unsafe-inline' for styles is required by the current build (Vite
    # injects inline <style> during hydration); scripts do NOT get it.
    #
    # ---------------------------------------------------------------
    # The sha256 in script-src is index.html's inline anti-flash theme
    # script (the one that reads localStorage "theme" before first paint).
    # It is hashed rather than allowed via 'unsafe-inline' so the rest of
    # script-src stays strict.
    #
    # IF YOU EDIT THAT SCRIPT IN index.html, THIS HASH MUST BE UPDATED or
    # CSP will block it -- silently, since the app still works and only the
    # theme flash comes back. Get the new value from the browser console
    # error, which prints the expected hash verbatim.
    # ---------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-tcbutJEq09K0yF/Yd+bFCQeZBKp7ojffb4TFJ6sj6sU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    # One explicit header rather than `expires` + add_header, which emits
    # two competing Cache-Control lines.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker must never be served stale, or clients can pin
    # themselves to an old app version indefinitely.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend's rate limiter is keyed on the socket peer and
        # deliberately ignores X-Forwarded-For (see core/rate_limit.py), so
        # behind this proxy all traffic shares one bucket. Documented
        # limitation, not a misconfiguration -- revisit if this deployment
        # ever needs per-client limits.
    }

    # SPA fallback: client-side routes (/login, /assets/123) have no file on
    # disk and must return index.html rather than 404. Last, so it can't
    # shadow the more specific locations above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
