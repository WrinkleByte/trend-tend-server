<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- iOS Safari doesn't fully honor manifest.webmanifest — these tags are
         required for a proper home-screen install (see docs/pwa-offline.md). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WrinkleByte Maintenance Tracker" />
    <title>WrinkleByte Maintenance Tracker</title>
    <script>
      // Blocking (not type="module") so this runs before first paint —
      // applies a saved light/dark override before CSS has a chance to
      // paint with the system default and flash the wrong theme.
      (function () {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
