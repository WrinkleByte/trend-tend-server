[project]
name = "wrinklebyte-backend"
version = "0.1.0"
description = "WrinkleByte backend API — FastAPI + PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff.lint]
ignore = [
    # FastAPI's own recommended pattern for request-scoped dependencies is
    # `param: X = Depends(get_x)` — that's exactly what B008 (no function
    # calls in argument defaults) flags, on every single route handler in
    # this codebase. Ignoring it here rather than one `# noqa` per
    # parameter, of which there are dozens.
    "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# All fixtures/tests share one event loop for the whole session — the
# session-scoped `engine` fixture's asyncpg pool must not be used from a
# different loop than the one it was created in (that mismatch is what
# causes asyncpg's "another operation is in progress" InterfaceError).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
