services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maintainit
      POSTGRES_PASSWORD: maintainit
      POSTGRES_DB: maintainit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintainit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://maintainit:maintainit@postgres:5432/maintainit
      JWT_SECRET: dev-secret-change-me
      STORAGE_BACKEND: local_disk
      STORAGE_LOCAL_ROOT: /data/attachments
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - attachments_data:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  attachments_data:
