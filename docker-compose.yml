# LOCAL DEVELOPMENT stack: Vite dev server, source bind-mounts, uvicorn
# --reload, DEV_MODE, and published default passwords. Don't expose it
# beyond your own machine. To self-host for real, use
# docker-compose.prod.yml (see README.md's "Self-hosting" section).
#
# Explicit project name — otherwise Compose derives it from the working
# directory name, which is exactly the kind of thing that silently changes
# out from under you if that directory ever gets renamed.
name: wrinklebyte

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wrinklebyte
      POSTGRES_PASSWORD: wrinklebyte
      POSTGRES_DB: wrinklebyte
    ports:
      # Override via a POSTGRES_HOST_PORT=... entry in a root .env file if
      # 5432 is already taken on your machine (Docker Compose reads that
      # file automatically) — container still listens on 5432 internally,
      # and `backend` talks to it over the Compose network at
      # postgres:5432 regardless, so DATABASE_URL below never needs to
      # change.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrinklebyte"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://wrinklebyte:wrinklebyte@postgres:5432/wrinklebyte
      # A second, non-superuser role for the app's own runtime queries --
      # `wrinklebyte` above is the Postgres cluster's bootstrap role
      # (POSTGRES_USER on the postgres service) and can never lose
      # SUPERUSER, so RLS policies can't actually restrict its queries
      # (see docs/architecture.md's Multi-tenancy section / Vikunja #44).
      # APP_DB_PASSWORD is read directly by the
      # 95d3e5f4643e_add_non_superuser_runtime_role_for_rls migration,
      # which creates `wrinklebyte_app` with this password on `alembic
      # upgrade` -- keep the two in sync if you change this value.
      APP_DB_PASSWORD: wrinklebyte-app-runtime
      RUNTIME_DATABASE_URL: postgresql+asyncpg://wrinklebyte_app:wrinklebyte-app-runtime@postgres:5432/wrinklebyte
      # This compose file is the LOCAL DEV stack. DEV_MODE bypasses the
      # startup guard in app/config.py that otherwise refuses to boot with
      # the published default secret below. A real deployment must set a
      # generated JWT_SECRET and leave DEV_MODE unset — see .env.example.
      DEV_MODE: "true"
      JWT_SECRET: dev-secret-change-me
      STORAGE_BACKEND: local_disk
      STORAGE_LOCAL_ROOT: /data/attachments
      # Base URL the web app is reachable at — used to build the link in
      # password-reset email. Set this to your real public URL in a root
      # .env file for any non-local deployment (see .env.example).
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # The backend's own externally-reachable URL, seeded into
      # instance_settings.public_api_url on first boot only (see
      # backend/app/core/instance_settings.py) -- used to build the
      # mobile-pairing QR code on the API Tokens page. Needed whenever web
      # and API are on different ports/hosts (true for this dev compose
      # stack by default: web on 5173, API on 8000) -- set it in a root
      # .env file to your host's LAN IP, e.g. PUBLIC_API_URL=http://192.168.1.50:8000,
      # or reconfigure later via the instance-settings admin UI.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      # Seeds the instance_settings singleton on first boot only (see
      # backend/app/core/instance_settings.py) — set these in a root .env
      # file (git-ignored; see .env.example) rather than editing here, so
      # SMTP_PASSWORD never ends up committed. No effect after the row
      # already exists; reconfigure via the instance-settings admin UI then.
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      # If true, the SMTP_* values above are re-applied on every request,
      # overwriting anything set via the admin instance-settings UI.
      SMTP_FORCE_ENV: ${SMTP_FORCE_ENV:-false}
    ports:
      # Override via a BACKEND_HOST_PORT=... entry in a root .env file if
      # 8000 is already taken on your machine (Docker Compose reads that
      # file automatically) — container still listens on 8000 internally.
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - attachments_data:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./web
    restart: unless-stopped
    environment:
      # backend's Compose network name + its *internal* port — not the
      # BACKEND_HOST_PORT mapping above, which only matters from outside
      # the Compose network. See vite.config.ts.
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      # Anonymous volume so the bind mount above doesn't shadow the
      # container's own npm-installed node_modules with the host's (which
      # may have different native binaries for esbuild/rollup/etc.).
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  attachments_data:
