# Publishes the release images when a version tag is pushed:
#
#   git tag v1.2.3 && git push github v1.2.3
#
# Each image is built natively on an amd64 and an arm64 runner (no QEMU
# emulation), pushed by digest, then joined into one multi-arch manifest
# tagged X.Y.Z and latest on BOTH registries, so Docker Hub and GHCR carry
# byte-identical images, the same as scripts/build-release-images.sh
# --push, which stays as the manual fallback.
#
# One-time setup (repo Settings):
#   - Variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN (a Docker Hub
#     access token with Read & Write on the wrinklebyte namespace). Both
#     live in the "release" environment, so add required reviewers there if
#     a tag push alone shouldn't be enough to publish.
#   - GHCR uses this workflow's own GITHUB_TOKEN. Because 1.0.0 was first
#     pushed by a personal token, each GHCR package must grant this repo
#     write access once: package page -> Package settings -> Manage Actions
#     access -> add trend-tend-server with the Write role.
#
# Third-party actions are pinned to full commit SHAs (tag in the trailing
# comment).

name: Release images

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_PREFIX: docker.io/wrinklebyte
  GHCR_PREFIX: ghcr.io/wrinklebyte

jobs:
  verify:
    name: Tag matches the version in the tree
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same checks scripts/build-release-images.sh makes, plus the tag
      # itself: refuse to publish an image whose /health version, compose
      # default or tag disagree.
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          backend="$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml | head -1)"
          web="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' web/package.json | head -1)"
          echo "tag=$tag backend=$backend web=$web"
          [[ "$tag" == "$backend" && "$tag" == "$web" ]] || { echo "::error::Version mismatch"; exit 1; }
          grep -q "WRINKLEBYTE_VERSION:-$tag}" docker-compose.prod.yml \
            || { echo "::error::docker-compose.prod.yml default WRINKLEBYTE_VERSION isn't $tag"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: verify
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: trend-tend-api, context: backend, arch: amd64, runner: ubuntu-24.04 }
          - { image: trend-tend-api, context: backend, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: trend-tend-web, context: web, arch: amd64, runner: ubuntu-24.04 }
          - { image: trend-tend-web, context: web, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile.prod
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ needs.verify.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,"name=${{ env.DOCKERHUB_PREFIX }}/${{ matrix.image }},${{ env.GHCR_PREFIX }}/${{ matrix.image }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Record digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "${{ steps.build.outputs.digest }}" > "$RUNNER_TEMP/digests/${{ matrix.image }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag ${{ matrix.image }} on both registries
    needs: [verify, build]
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [trend-tend-api, trend-tend-web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests (X.Y.Z and latest)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ${{ matrix.image }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          for prefix in "$DOCKERHUB_PREFIX" "$GHCR_PREFIX"; do
            refs=()
            for f in "$DIGESTS_DIR"/*; do refs+=("$prefix/$IMAGE@$(cat "$f")"); done
            docker buildx imagetools create \
              --tag "$prefix/$IMAGE:$VERSION" \
              --tag "$prefix/$IMAGE:latest" \
              "${refs[@]}"
          done
      - name: Verify both architectures are published
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          for prefix in "$DOCKERHUB_PREFIX" "$GHCR_PREFIX"; do
            platforms="$(docker buildx imagetools inspect "$prefix/$IMAGE:$VERSION" --format '{{json .Manifest}}' \
              | python3 -c 'import sys,json; m=json.load(sys.stdin); print(" ".join(sorted(p["platform"]["architecture"] for p in m["manifests"] if p.get("platform",{}).get("architecture") not in (None,"unknown"))))')"
            echo "$prefix/$IMAGE:$VERSION -> $platforms"
            [[ "$platforms" == "amd64 arm64" ]] || { echo "::error::$prefix/$IMAGE:$VERSION is missing an architecture"; exit 1; }
          done
