# Main nginx config for the all-in-one image. nginx runs as the image's
# unprivileged user, so every path it writes is somewhere that user owns,
# and logs go to the container's stdout/stderr. The server block itself is
# web/nginx.conf (see aio/Dockerfile).

worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    include /etc/nginx/trend-tend-site.conf;
}
