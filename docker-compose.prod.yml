# Production stack for self-hosting Trend & Tend Server with PostgreSQL in
# its own container (the official postgres image). The simplest install is
# a single `docker run` of the same server image with its built-in database
# instead; see the README's Self-hosting section.
#
#   cp .env.prod.example .env      # then fill in every REQUIRED value
#   docker compose -f docker-compose.prod.yml pull     # released image
#   docker compose -f docker-compose.prod.yml up -d
#
# Or build the server image from this source tree instead of pulling it:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Upgrading: set WRINKLEBYTE_VERSION in .env to the new release (or leave it
# unset for this file's default), then `pull` and `up -d --remove-orphans`.
# Migrations run automatically when the server starts. Back up the
# postgres_data, attachments_data and server_data volumes first.
#
# Coming from 1.0.x (separate backend and web containers): replace this
# file, keep the same .env and volumes, then `pull` and
# `up -d --remove-orphans`. The old backend/web containers are removed and
# the server container takes over the same data.
#
# docker-compose.yml (no .prod) is the LOCAL DEVELOPMENT stack -- Vite dev
# server, source bind-mounts, uvicorn --reload, DEV_MODE, published default
# passwords. Never expose that one to a network you don't trust.
#
# What's different here:
#   * One published port. The server container serves the web app and the
#     API on the same origin; Postgres is reachable only on the internal
#     Compose network. The mobile apps pair against that same URL.
#   * Secrets: POSTGRES_PASSWORD must be set (Compose refuses to start
#     without it). APP_DB_PASSWORD and JWT_SECRET may be set in .env; if
#     not, the server generates them once and keeps them in server_data.
#   * Non-root (after fixing volume ownership at start), read-only root
#     filesystem, no new privileges.
#
# Put TLS in front of WEB_HOST_PORT (Caddy, Traefik, a Cloudflare tunnel,
# ...) for anything reachable beyond your own LAN.

name: wrinklebyte

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wrinklebyte
      # Only takes effect when the data volume is first initialised.
      # Changing it later does NOT change the password of an existing
      # database -- use ALTER ROLE inside it, then update this value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wrinklebyte
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrinklebyte"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ${WRINKLEBYTE_IMAGE_PREFIX:-wrinklebyte}/trend-tend-server:${WRINKLEBYTE_VERSION:-1.1.0}
    build:
      context: .
      dockerfile: aio/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    environment:
      # Setting DATABASE_URL is what makes the server use this postgres
      # service instead of starting its own. This is the bootstrap role,
      # used for migrations; the API itself queries as the non-superuser
      # wrinklebyte_app role so row-level security applies.
      DATABASE_URL: postgresql+asyncpg://wrinklebyte:${POSTGRES_PASSWORD}@postgres:5432/wrinklebyte
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # DEV_MODE deliberately absent.
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FORCE_ENV: ${SMTP_FORCE_ENV:-false}
    volumes:
      # Generated secrets (when not set in .env) live here.
      - server_data:/data
      # Same volume name as 1.0.x's backend container, so an upgrade keeps
      # every attachment.
      - attachments_data:/data/attachments
    read_only: true
    tmpfs:
      # nginx pid and buffers, upload spooling, mktemp.
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  attachments_data:
  server_data:
