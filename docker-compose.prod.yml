# Production stack for self-hosting WrinkleByte.
#
#   cp .env.prod.example .env      # then fill in every REQUIRED value
#   docker compose -f docker-compose.prod.yml pull     # released images
#   docker compose -f docker-compose.prod.yml up -d
#
# Or build the images from this source tree instead of pulling them:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Upgrading: set WRINKLEBYTE_VERSION in .env to the new release (or leave it
# on a release you trust), then `pull` and `up -d` again. Migrations run
# automatically when the backend starts. Back up the postgres_data and
# attachments_data volumes first.
#
# docker-compose.yml (no .prod) is the LOCAL DEVELOPMENT stack -- Vite dev
# server, source bind-mounts, uvicorn --reload, DEV_MODE, published default
# passwords. Never expose that one to a network you don't trust.
#
# What's different here:
#   * One published port. nginx in the web container serves the app and
#     proxies /api/ to the backend on the same origin, so Postgres and the
#     backend are reachable only on the internal Compose network. The
#     mobile apps pair against that same URL (they call <url>/api/v1/...).
#   * No defaults for secrets. Compose refuses to start (":?" below) until
#     each one is set, and the backend's own startup guard (app/config.py)
#     rejects a short or default JWT_SECRET.
#   * Images are built from the Dockerfile.prod files: non-root, no dev
#     dependencies, no source mounts.
#
# Put TLS in front of WEB_HOST_PORT (Caddy, Traefik, a Cloudflare tunnel,
# ...) for anything reachable beyond your own LAN.

name: wrinklebyte

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wrinklebyte
      # Only takes effect when the data volume is first initialised.
      # Changing it later does NOT change the password of an existing
      # database -- use ALTER ROLE inside it, then update this value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wrinklebyte
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrinklebyte"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${WRINKLEBYTE_IMAGE_PREFIX:-wrinklebyte}/trend-tend-api:${WRINKLEBYTE_VERSION:-1.0.0}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      # Bootstrap (superuser) role: used only to run migrations at startup.
      DATABASE_URL: postgresql+asyncpg://wrinklebyte:${POSTGRES_PASSWORD}@postgres:5432/wrinklebyte
      # Non-superuser role the app queries as, so the Postgres row-level
      # security policies actually apply (Vikunja #44). The migration that
      # creates `wrinklebyte_app` reads APP_DB_PASSWORD on first upgrade;
      # both lines must use the same value.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      RUNTIME_DATABASE_URL: postgresql+asyncpg://wrinklebyte_app:${APP_DB_PASSWORD}@postgres:5432/wrinklebyte
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # DEV_MODE deliberately absent.
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
      # Same origin as the web app, since nginx proxies /api/. Seeds the
      # mobile-pairing QR code on first boot only; changeable later in the
      # web app's instance settings.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-${FRONTEND_URL}}
      STORAGE_BACKEND: local_disk
      STORAGE_LOCAL_ROOT: /data/attachments
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FORCE_ENV: ${SMTP_FORCE_ENV:-false}
    volumes:
      - attachments_data:/data/attachments
    read_only: true
    tmpfs:
      # Large uploads are spooled here before reaching the attachment
      # volume. Mode is explicit: a tmpfs mount is root-owned 0755 by
      # default, which the unprivileged app user can't write to.
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WRINKLEBYTE_IMAGE_PREFIX:-wrinklebyte}/trend-tend-web:${WRINKLEBYTE_VERSION:-1.0.0}
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      # nginx writes its pid file and proxy/body buffers; everything else
      # in the image is read-only.
      # Owned by the image's `nginx` user (uid/gid 101), which the master
      # process runs as; root-owned defaults make nginx exit at startup.
      - /run:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  attachments_data:
